<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Reviewer & Auto Bug Fixer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg font-mono font-bold text-xl">AI</div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">CodeReviewer.ai</h1>
          <p class="text-xs text-slate-400">Powered by Django & Groq (gpt-oss-120b)</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <select id="langSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 outline-none">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="sql">SQL</option>
        </select>
        <button id="submitBtn" onclick="runCodeReview()" class="bg-indigo-600 hover:bg-indigo-500 font-medium px-4 py-1.5 rounded-lg text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-500/20">
          <span>Review & Fix Code</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Left: Original Code Input -->
    <div class="flex flex-col h-[750px] bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="bg-slate-800/70 px-4 py-2.5 border-b border-slate-800 flex justify-between items-center text-xs font-mono text-slate-400">
        <span>INPUT SOURCE CODE</span>
        <button onclick="loadSampleBuggyCode()" class="text-indigo-400 hover:underline">Load Buggy Example</button>
      </div>
      <textarea id="codeInput" placeholder="# Paste your buggy Python or Django code here..." class="flex-1 w-full bg-transparent p-4 font-mono text-sm resize-none outline-none text-slate-200 border-none"></textarea>
    </div>

    <!-- Right: Review Results & Auto-Fixed Code -->
    <div class="flex flex-col h-[750px] bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      
      <!-- Score & Summary Bar -->
      <div id="statsBar" class="bg-slate-800/80 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-xs font-mono text-slate-400">QUALITY SCORE:</span>
          <span id="scoreBadge" class="font-bold text-sm px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-300">-- / 100</span>
        </div>
        <button id="copyFixedBtn" onclick="copyFixedCode()" class="hidden text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-200">Copy Fixed Code</button>
      </div>

      <!-- Scrollable Review Details -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- Summary Box -->
        <div id="summaryCard" class="hidden bg-slate-800/50 border border-slate-700/60 rounded-lg p-3 text-sm text-slate-300">
          <strong class="text-indigo-400">Executive Summary: </strong>
          <span id="summaryText"></span>
        </div>

        <!-- Issues List -->
        <div id="issuesSection" class="space-y-2">
          <p class="text-xs font-mono text-slate-500 uppercase">Detected Issues & Vulnerabilities</p>
          <div id="issuesContainer" class="space-y-2 text-sm">
            <p class="text-slate-500 italic text-xs">Run a review to see detected bugs and security risks.</p>
          </div>
        </div>

        <!-- Fixed Code Box -->
        <div id="fixedSection" class="space-y-2 pt-2">
          <p class="text-xs font-mono text-slate-500 uppercase">Auto-Fixed & Refactored Code</p>
          <pre id="fixedCodeDisplay" class="bg-slate-950 p-4 rounded-lg font-mono text-xs text-emerald-400 overflow-x-auto border border-slate-800 max-h-72"># Refactored code will appear here...</pre>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Sample broken code demo purpose ke liye
    function loadSampleBuggyCode() {
      document.getElementById('codeInput').value = 
`def get_user_profile(request):
    user_id = request.GET.get('id')
    # Unsafe raw query (SQL Injection risk)
    query = f"SELECT * FROM auth_user WHERE id = {user_id}"
    
    # Missing error handling & unused variables
    data = db_execute(query)
    temp = 12345
    return JsonResponse({'user': data})`;
    }

    async function runCodeReview() {
      const code = document.getElementById('codeInput').value.trim();
      const language = document.getElementById('langSelect').value;
      const submitBtn = document.getElementById('submitBtn');

      if (!code) {
        alert("Please paste some code first!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = "<span>Analyzing with AI...</span>";

      try {
        const response = await fetch('/api/review/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ code: code, language: language })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        // Update Score
        const scoreBadge = document.getElementById('scoreBadge');
        scoreBadge.innerText = `${data.score} / 100`;
        if (data.score >= 80) scoreBadge.className = "font-bold text-sm px-2.5 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800";
        else if (data.score >= 50) scoreBadge.className = "font-bold text-sm px-2.5 py-0.5 rounded-full bg-amber-950 text-amber-400 border border-amber-800";
        else scoreBadge.className = "font-bold text-sm px-2.5 py-0.5 rounded-full bg-rose-950 text-rose-400 border border-rose-800";

        // Update Summary
        document.getElementById('summaryCard').classList.remove('hidden');
        document.getElementById('summaryText').innerText = data.summary;

        // Render Issues
        const issuesContainer = document.getElementById('issuesContainer');
        issuesContainer.innerHTML = '';
        if (data.issues && data.issues.length > 0) {
          data.issues.forEach(issue => {
            const el = document.createElement('div');
            el.className = "p-3 rounded-lg border border-rose-900/50 bg-rose-950/20";
            el.innerHTML = `
              <div class="flex justify-between items-center text-xs font-mono text-rose-400 mb-1">
                <span>[${issue.type || 'Issue'}] Line: ${issue.line || 'N/A'}</span>
                <span class="uppercase">${issue.severity || 'Medium'}</span>
              </div>
              <p class="text-xs text-slate-200 mb-1 font-semibold">${issue.description || ''}</p>
              <p class="text-xs text-slate-400"><strong class="text-indigo-400">Suggestion:</strong> ${issue.suggestion || ''}</p>
            `;
            issuesContainer.appendChild(el);
          });
        } else {
          issuesContainer.innerHTML = '<p class="text-xs text-emerald-400">No major issues found! Clean code.</p>';
        }

        // Render Fixed Code
        document.getElementById('fixedCodeDisplay').innerText = data.fixed_code;
        document.getElementById('copyFixedBtn').classList.remove('hidden');

      } catch (err) {
        alert("Review failed: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Review & Fix Code</span>";
      }
    }

    function copyFixedCode() {
      const code = document.getElementById('fixedCodeDisplay').innerText;
      navigator.clipboard.writeText(code);
      alert("Refactored code copied to clipboard!");
    }
  </script>
</body>
</html>
